version: "3.9"

# =============================================================================
# Jarvis — Ambiente de desenvolvimento local
# =============================================================================
#
# Serviços:
#   db       — PostgreSQL 16 (banco principal)
#   redis    — Redis 7 (filas, cache)
#   pgadmin  — interface web para o banco (opcional)
#
# Uso:
#   docker compose -f cookbook/jarvis/infra/docker-compose.yml up -d
#   docker compose -f cookbook/jarvis/infra/docker-compose.yml down
#
# Banco disponível em:
#   postgresql://ai:ai@localhost:5532/ai
#
# PgAdmin disponível em:
#   http://localhost:5050  (admin@jarvis.local / admin)
# =============================================================================

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: jarvis-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
    ports:
      - "5532:5432"
    volumes:
      - jarvis_db_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d   # auto-executes *.sql on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - jarvis_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: jarvis-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@jarvis.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - jarvis_pgadmin_data:/var/lib/pgadmin
    profiles:
      - pgadmin   # only starts with: docker compose --profile pgadmin up

volumes:
  jarvis_db_data:
  jarvis_redis_data:
  jarvis_pgadmin_data:
